<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LiveSub overlay</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{display:flex;flex-direction:column;justify-content:flex-end;padding:6px;box-sizing:border-box}
#root{width:100%}
body.unlocked{-webkit-app-region:drag;background:rgba(40,44,52,.35);outline:2px dashed rgba(255,255,255,.55);outline-offset:-3px;border-radius:10px}
#hint{display:none;position:absolute;top:8px;left:0;right:0;text-align:center;color:#fff;font:13px "Microsoft YaHei UI",sans-serif;text-shadow:0 1px 2px #000}
body.unlocked #hint{display:block}
</style><style id="cap"></style></head>
<body><div id="hint">Drag to move · drag edges to resize · Ctrl+Alt+L to lock</div><div id="root"></div>
<script type="module" src="overlay.js"></script></body></html>
