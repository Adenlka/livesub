<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LiveSub</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header>
    <div class="brand"><img src="icons/32.png" alt=""><b>LiveSub</b><small>Live subtitles</small></div>
    <div class="meter" title="Level (green = voice detected)"><i id="level"></i></div>
  </header>
  <button id="toggle" class="primary">Start subtitles for this tab</button>
  <div id="status" class="status">Not started</div>
  <div class="row">
    <button id="panel">Transcript / export</button>
    <button id="resetSpk" title="Start speaker identification over when the show or people change">Reset speakers</button>
  </div>
  <div id="restart" class="notice hide">This setting takes effect after restarting subtitles.</div>
  <div id="firstRun" class="notice hide"></div>
  <form id="form" onsubmit="return false"></form>
  <details class="models"><summary>Models &amp; storage</summary>
    <p id="cacheInfo" class="muted">…</p>
    <button id="unload" type="button">Free memory (unload models)</button>
    <button id="clearCache" type="button">Delete downloaded models</button>
  </details>
  <footer>Alt+Shift+S to toggle · drag subtitles to move, double-click to reset</footer>
  <script type="module" src="popup.js"></script>
</body></html>
