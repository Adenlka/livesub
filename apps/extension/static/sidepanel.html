<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>LiveSub 字幕记录</title><link rel="stylesheet" href="sidepanel.css"></head>
<body>
  <header><b>字幕记录</b><span id="state" class="muted"></span></header>
  <div class="row">
    <input id="q" type="search" placeholder="搜索…">
  </div>
  <div class="row">
    <button data-exp="txt">导出文本</button><button data-exp="srt">导出 SRT</button><button data-exp="vtt">导出 VTT</button>
  </div>
  <div class="row"><button id="sum">AI 总结</button><button id="copy">复制全部</button><button id="clear">清空</button></div>
  <section id="summary" class="summary hide"></section>
  <main id="log"><div class="empty">开始字幕后，内容会实时出现在这里。</div></main>
  <script type="module" src="sidepanel.js"></script>
</body></html>
