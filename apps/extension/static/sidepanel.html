<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LiveSub transcript</title><link rel="stylesheet" href="sidepanel.css"></head>
<body>
  <header><b>Transcript</b><span id="state" class="muted"></span></header>
  <label class="row keep"><input type="checkbox" id="keep"> <span>Keep full transcript (off = only recent lines, saves memory)</span></label>
  <div class="row">
    <input id="q" type="search" placeholder="Search…">
  </div>
  <div class="row">
    <button data-exp="txt">Export text</button><button data-exp="srt">Export SRT</button><button data-exp="vtt">Export VTT</button>
  </div>
  <div class="row"><button id="sum">AI summary</button><button id="copy">Copy all</button><button id="clear">Clear</button></div>
  <section id="summary" class="summary hide"></section>
  <main id="log"><div class="empty">Once subtitles start, they appear here in real time.</div></main>
  <script type="module" src="sidepanel.js"></script>
</body></html>
